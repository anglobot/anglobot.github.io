<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Schulte Table – Voice Adjacent</title>
<style>
  body{
    margin:0; background:#0b0f1a; color:#eaf2ff;
    font-family:system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .app{width:min(980px,100%); display:grid; grid-template-columns:1.1fr 1fr; gap:20px;}
  @media(max-width:900px){.app{grid-template-columns:1fr;}}

  .panel{background:#11162a; border-radius:16px; padding:16px 18px;}
  .header{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .title{font-weight:700; font-size:1.05rem;}
  .status{display:flex; gap:12px; flex-wrap:wrap;}
  .chip{background:#0f1731; border-radius:999px; padding:8px 12px; font-size:.92rem;}
  .chip strong{color:#fff;}

  .controls{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  button{all:unset; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:650;}
  .btn{background:#1f2a52; color:#dff0ff;}
  .btn-danger{background:#3b1c26; color:#ffd8df;}
  .btn-primary{background:#2a4b8c; color:#eaf2ff;}

  .grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-top:10px;}
  .cell{
    aspect-ratio:1/1; background:#0e142a; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.35rem; font-weight:760;
  }
  .cell.adj-ok{outline:2px solid #4ae36b;}
  .cell.adj-bad{outline:2px solid #ff6b6b;}

  .log{height:180px; overflow:auto; padding:10px; background:#0e152d; border-radius:12px;}
  .log p{margin:0; padding:6px 0; border-bottom:1px dashed #1e2748;}
  .log p:last-child{border-bottom:0;}
  .log .ok{color:#6df29b;}
  .log .err{color:#ff9393;}
  .log .info{color:#9bd0ff;}

  .flash{position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.7);}
  .flash.show{display:grid;}
  .flash h1{font-size:3rem; color:#6bd9ff; font-weight:900;}
</style>
</head>
<body>
<main class="app">
  <section class="panel">
    <div class="header">
      <div class="title">Schulte Table – Voice Adjacent</div>
      <div class="status">
        <div class="chip"><strong>Target:</strong> <span id="targetChip">1</span></div>
        <div class="chip"><strong>Elapsed:</strong> <span id="timer">00:00.0</span></div>
        <div class="chip"><strong>Mic:</strong> <span id="micState">off</span></div>
      </div>
    </div>
    <div class="controls">
      <button id="btnNew" class="btn">Shuffle grid</button>
      <button id="btnMic" class="btn-primary">Turn on mic</button>
      <button id="btnStop" class="btn-danger">Stop app</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>
  <section class="panel">
    <div class="title">Voice log</div>
    <div id="log" class="log"></div>
  </section>
</main>
<div id="flash" class="flash"><h1>Congratulations!</h1></div>

<script>
const gridEl=document.getElementById('grid');
const targetChip=document.getElementById('targetChip');
const timerEl=document.getElementById('timer');
const micStateEl=document.getElementById('micState');
const logEl=document.getElementById('log');
const btnNew=document.getElementById('btnNew');
const btnMic=document.getElementById('btnMic');
const btnStop=document.getElementById('btnStop');
const flashEl=document.getElementById('flash');

let cells=[],mapNumToPos=new Map(),target=1,startedAt=null,timerTick=null;
let recognition=null,recognizing=false;

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function mmssms(deltaMs){const ms=Math.floor(deltaMs%1000/100);const s=Math.floor(deltaMs/1000)%60;const m=Math.floor(deltaMs/60000);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${ms}`;}
function log(line,cls='info'){const p=document.createElement('p');p.className=cls;p.textContent=line;logEl.appendChild(p);logEl.scrollTop=logEl.scrollHeight;}

function buildGrid(){
  gridEl.innerHTML='';cells=[];mapNumToPos.clear();
  const nums=shuffle([...Array(36)].map((_,i)=>i+1));
  for(let r=0;r<6;r++){for(let c=0;c<6;c++){
    const n=nums[r*6+c];
    const el=document.createElement('div');el.className='cell';el.textContent=n;
    gridEl.appendChild(el);
    const cell={n,row:r,col:c,el};cells.push(cell);mapNumToPos.set(n,cell);
  }}
}

function startTimer(){startedAt=performance.now();if(timerTick)cancelAnimationFrame(timerTick);
  const tick=()=>{if(!startedAt)return;timerEl.textContent=mmssms(performance.now()-startedAt);timerTick=requestAnimationFrame(tick);};
  timerTick=requestAnimationFrame(tick);}
function stopTimer(){const end=startedAt?performance.now()-startedAt:0;if(timerTick)cancelAnimationFrame(timerTick);timerTick=null;startedAt=null;return end;}

const numberWords={'one':1,'two':2,'three':3,'four':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,'ten':10,'eleven':11,'twelve':12,'thirteen':13,'fourteen':14,'fifteen':15,'sixteen':16,'seventeen':17,'eighteen':18,'nineteen':19,'twenty':20,'twenty one':21,'twenty two':22,'twenty three':23,'twenty four':24,'twenty five':25,'twenty six':26,'twenty seven':27,'twenty eight':28,'twenty nine':29,'thirty':30,'thirty one':31,'thirty two':32,'thirty three':33,'thirty four':34,'thirty five':35,'thirty six':36};
function parseUtterance(s){const raw=s.toLowerCase().trim();let dir=null;if(/\bright\b/.test(raw))dir='right';else if(/\bleft\b/.test(raw))dir='left';let num=null;const numMatch=raw.match(/\b(\d{1,2})\b/);if(numMatch)num=parseInt(numMatch[1],10);else{for(const w in numberWords){if(raw.includes(w)){num=numberWords[w];break;}}}return{num,dir,raw};}

function initRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){log('Speech recognition not supported','err');return null;}
  const r=new SR();r.lang='en-US';r.continuous=true;r.interimResults=false;
  r.onstart=()=>{recognizing=true;micStateEl.textContent='on';log('Mic listening…');};
  r.onend=()=>{recognizing=false;micStateEl.textContent='off';};
  r.onerror=e=>log(`Mic error: ${e.error}`,'err');
  r.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++){if(!ev.results[i].isFinal)continue;handleCommand(ev.results[i][0].transcript);}}
